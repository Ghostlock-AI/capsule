#cloud-config
package_update: true
packages:
  - curl
  - linux-headers-generic
  - bpfcc-tools
  - build-essential
  - git

users:
  - default
  - name: agent
    gecos: Capsule Agent
    groups: [agent]
    shell: /bin/bash
    lock_passwd: true

write_files:
  - path: /etc/tracee/config.yaml
    owner: root:root
    permissions: '0644'
    content: |
      dnscache:
        enable: true
      containers:
        enrich: false
      proctree:
        source: both
        cache:
          process: 8192
          thread: 8192
      output:
        options:
          parse-arguments: true
          parse-arguments-fds: true
          exec-hash: digest-inode
        json:
          files:
            - /var/log/tracee/events.jsonl
      events:
        # Process lifecycle (baseline + security layer)
        - sched_process_exec    # Process execution (scheduler event)
        - execve                # Process execution (syscall - backup)
        - exit_group            # Process termination (clean exit)
        - exit                  # Process exit (fallback)

        # Network connections (TCP only, no Unix sockets)
        - net_tcp_connect       # TCP connections with dst IP:port
        - connect               # Raw connect syscall (backup)

        # File operations (baseline syscalls)
        - openat                # File open/create with flags
        - close                 # File/socket close
  - path: /etc/systemd/system/tracee.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Tracee eBPF runtime
      After=network.target

      [Service]
      Type=simple
      ExecStart=/bin/bash -lc "/usr/local/bin/tracee --config /etc/tracee/config.yaml --scope uid=$(id -u agent) --scope pid=new --scope follow --log file:/var/log/tracee/tracee.log"
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
  - path: /etc/sudoers.d/agent-dev
    owner: root:root
    permissions: '0440'
    content: |
      # Development convenience: allow agent to escalate
      agent ALL=(ALL) NOPASSWD:SETENV: ALL
  - path: /etc/systemd/system/ghostd.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Ghostlock Security Daemon
      After=tracee.service
      Requires=tracee.service

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/ghostd \
          --input /var/log/tracee/events.jsonl \
          --output /var/log/tracee/events-readable.jsonl
      Restart=always
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target

runcmd:
  - mkdir -p /home/agent/workspace
  - chown agent:agent /home/agent/workspace
  - sudo -u agent git config --global user.name "$GIT_USER_NAME"
  - sudo -u agent git config --global user.email "$GIT_USER_EMAIL"
  - sudo -u agent git config --global credential.helper store
  - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
  - sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
  - sudo apt-get update
  - sudo apt-get install -y gh
  - if [ -n "$GITHUB_TOKEN" ]; then echo "$GITHUB_TOKEN" | sudo -u agent gh auth login --with-token; echo "GitHub CLI authenticated"; fi
  - mkdir -p /var/log/tracee
  - echo "Installing Tracee..."
  - ARCH=$(uname -m)
  - if [ "$ARCH" = "aarch64" ]; then TAR="tracee-aarch64.v0.23.2.tar.gz"; else TAR="tracee-x86_64.v0.23.2.tar.gz"; fi
  - curl -fsSL "https://github.com/aquasecurity/tracee/releases/download/v0.23.2/$TAR" -o /tmp/tracee.tar.gz
  - cd /tmp && tar -xzf tracee.tar.gz
  - cp dist/tracee /usr/local/bin/tracee
  - cp -r dist/signatures /usr/local/bin/signatures
  - chmod +x /usr/local/bin/tracee
  - rm -rf /tmp/tracee.tar.gz /tmp/dist /tmp/LICENSE
  - echo "Tracee installed"
  - systemctl daemon-reload
  - systemctl enable tracee.service
  - systemctl start tracee.service
  - echo "Tracee service started"
  - echo "Building ghostd (Ghostlock Security Daemon)..."
  - if ! command -v rustc >/dev/null 2>&1; then apt-get update && apt-get install -y curl build-essential && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && export PATH="/root/.cargo/bin:$PATH"; fi
  - export PATH="/root/.cargo/bin:$PATH"
  - cp -r /tmp/ghostd-src /tmp/build-ghostd
  - cd /tmp/build-ghostd && /root/.cargo/bin/cargo build --release
  - install -m 0755 /tmp/build-ghostd/target/release/ghostd /usr/local/bin/ghostd
  - rm -rf /tmp/build-ghostd
  - echo "ghostd built and installed to /usr/local/bin/ghostd"
  - systemctl enable ghostd.service
  - systemctl start ghostd.service
  - echo "Ghostlock daemon started"

final_message: |
  capsule-vm sandbox ready.
