# Capsule VM - Optimized Lima Template
# Fast, writable, secure VM configuration for development

# VM Resources
cpus: 2
memory: "1G"
disk: "8G"

# Ubuntu 24.04 LTS (latest)
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# Mounts - writable host home directory
mounts:
  - location: "~"
    writable: true
  - location: "/tmp/lima"
    writable: true

# SSH configuration
ssh:
  localPort: 0
  loadDotSSHPubKeys: true

# Disable containerd (we don't need it)
containerd:
  system: false
  user: false

# Use ubuntu user for compatibility
user:
  name: agent
  uid: 1000
  home: /home/agent
  shell: /bin/bash

# Provision script - runs once on first boot
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -e

      # Create workspace directory if image already includes ubuntu user
      mkdir -p /home/ubuntu/workspace || true

# Firmware and video (headless)
firmware:
  legacyBIOS: false

video:
  display: "none"

# Performance optimizations
upgradePackages: false  # Don't auto-upgrade packages (saves time)
