# AppArmor Profile Configuration for Agent Workload
profile_name: capsule-agent-workload

# File access rules
file_rules:
  # Read-only access (bash config files, etc)
  read_only:
    - /etc/bash.bashrc
    - /etc/profile
    - /etc/profile.d/**
    - owner @{HOME}/.bashrc
    - owner @{HOME}/.bash_profile
    - owner @{HOME}/.bash_login
    - owner @{HOME}/.profile
    - owner @{HOME}/.bash_logout

  # Read and execute access to system binaries and libraries
  read_execute:
    - /usr/**
    - /lib/**
    - /lib64/**
    - /bin/**
    - /sbin/**

  # Read-write access to workspace and temporary directories
  read_write:
    - /workspace/**
    - /tmp/**
    - /var/log/capsule/**
    - owner @{HOME}/.bash_history

  # Explicitly denied paths (no access at all)
  deny:
    - owner @{HOME}/.ssh/**
    - /etc/shadow
    - /etc/sudoers
    - /etc/sudoers.d/**
    - /root/**
    - /var/log/**  # Denied except /var/log/capsule/** which is allowed above

# Capability rules
capabilities:
  # Allowed capabilities (basic userland operations)
  allow:
    - chown
    - dac_override
    - dac_read_search
    - fowner
    - fsetid
    - setgid
    - setuid

  # Explicitly denied capabilities (sensitive operations)
  deny:
    - sys_admin
    - net_admin
    - sys_ptrace
    - sys_module
    - sys_rawio
    - sys_boot
    - sys_time
    - mac_admin
    - mac_override

# Network rules (optional - can be customized)
network:
  allow:
    - inet
    - inet6
    - unix

# Signal rules (optional)
signals:
  allow: true

# Additional settings
settings:
  # Include base abstractions for common operations
  include_base: true
  # Complain mode (false = enforce, true = complain/log only)
  complain_mode: false
