[package]
name = "capsule"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
base64 = "0.22"
clap = { version = "4.5.47", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
which = "8.0.0"

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "capsule"
path = "src/main.rs"
