[package]
name = "launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive"] }
nix = { version = "0.28.0", features = ["process", "signal", "fs", "user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "8.0.0"
