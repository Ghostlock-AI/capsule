# Capsule VM - Default Lima Template
# This template is used when creating VMs

# Default resources (will be replaced by CLI args)
cpus: 2
memory: "2GiB"
disk: "10GiB"

# Ubuntu 24.04 LTS
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# Mounts - writable host directory
mounts:
  - location: "~"
    writable: true
  - location: "/tmp/lima"
    writable: true
  - location: "{{CAPSULE_PROJECT_ROOT}}/log-filter"
    mountPoint: "/tmp/capsule-log-filter-src"
    writable: false

# SSH configuration
ssh:
  localPort: 0
  loadDotSSHPubKeys: true

# Disable containerd (not needed for agent VMs)
containerd:
  system: false
  user: false

# Guest user configuration
user:
  name: agent
  uid: 1000
  home: /home/agent
  shell: /bin/bash

# Provisioning - Execute cloud-init script
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -e

      # Cloud-init content will be injected here
{{CLOUD_INIT_CONTENT}}

  # Build log filter binary during first boot
  - mode: system
    script: |
      #!/bin/bash
      set -exo pipefail

      echo "Building capsule-log-filter binary..."

      # Install Rust if not present
      if ! command -v rustc >/dev/null 2>&1; then
        apt-get update
        apt-get install -y curl build-essential
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        export PATH="/root/.cargo/bin:$PATH"
      fi

      # Copy source to writable location and build
      cp -r /tmp/capsule-log-filter-src /tmp/build-capsule-log-filter
      cd /tmp/build-capsule-log-filter
      /root/.cargo/bin/cargo build --release

      # Install binary
      install -m 0755 target/release/capsule-log-filter /usr/local/bin/capsule-log-filter

      # Clean up build directory
      rm -rf /tmp/build-capsule-log-filter

      # Verify it's installed
      /usr/local/bin/capsule-log-filter --version || echo "Binary installed"

      echo "capsule-log-filter built and installed successfully"
