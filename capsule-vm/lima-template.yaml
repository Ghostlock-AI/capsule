# Capsule VM - Optimized Lima Template
# Fast, writable, secure VM configuration for development

# VM Resources
cpus: 2
memory: "1G"
disk: "8G"

# Ubuntu 24.04 LTS (latest)
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# Mounts - writable host home directory
mounts:
  - location: "~"
    writable: true
  - location: "/tmp/lima"
    writable: true

# SSH configuration
ssh:
  localPort: 0
  loadDotSSHPubKeys: true

# Disable containerd (we don't need it)
containerd:
  system: false
  user: false

# Use ubuntu user for compatibility
user:
  name: ubuntu
  uid: 1000
  home: /home/ubuntu
  shell: /bin/bash

# Provision script - runs once on first boot
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -e

      # Create workspace directory
      mkdir -p /home/ubuntu/workspace
      chown -R ubuntu:ubuntu /home/ubuntu/workspace

      # Install capsule-info script
      cat > /usr/local/bin/capsule-info << 'EOF'
      #!/bin/bash
      echo "═══════════════════════════════════════════════════════════"
      echo "  CAPSULE VM: $HOSTNAME"
      echo "═══════════════════════════════════════════════════════════"
      echo ""

      # Workspace info
      if mountpoint -q /home/ubuntu/workspace 2>/dev/null; then
          echo "📂 Workspace: /home/ubuntu/workspace (mounted from host)"
      else
          echo "📂 Workspace: /home/ubuntu/workspace (local)"
      fi

      # IP address
      IP=$(hostname -I | awk '{print $1}')
      echo "🌐 IP Address: ${IP:-N/A}"

      # Resources
      CPUS=$(nproc)
      MEM=$(free -h | awk '/^Mem:/ {print $2}')
      echo "💻 Resources: ${CPUS} CPUs, ${MEM} RAM"

      echo ""
      echo "═══════════════════════════════════════════════════════════"
      EOF
      chmod +x /usr/local/bin/capsule-info

      # Add capsule-info to profile
      cat > /etc/profile.d/10-capsule.sh << 'EOF'
      #!/bin/bash
      # Capsule VM login profile
      if [ -f /usr/local/bin/capsule-info ]; then
          /usr/local/bin/capsule-info
      fi
      EOF
      chmod +x /etc/profile.d/10-capsule.sh

# Firmware and video (headless)
firmware:
  legacyBIOS: false

video:
  display: "none"

# Performance optimizations
upgradePackages: false  # Don't auto-upgrade packages (saves time)
