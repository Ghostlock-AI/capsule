#cloud-config
package_update: true
packages: [{{EXTRA_PACKAGES}}]

# Create the non-root runtime user expected by ds
users:
  - name: agent
    gecos: "Dimension Shifter Agent"
    shell: /bin/bash
    groups: [sudo]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true

write_files:
  - path: /etc/motd
    content: |
      You are inside Dimension Shifter: {{VM_NAME}}

runcmd:
  - "true"  # keep list valid even if no extras
  - "mkdir -p /home/agent/work"
  - "chown -R agent:agent /home/agent"
{{RUNCMD_EXTRA}}

final_message: |
  ds sandbox ready. Use: multipass shell {{VM_NAME}}
